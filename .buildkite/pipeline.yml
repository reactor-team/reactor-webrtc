#
# Buildkite CI for reactor-webrtc — the INTERNAL, heavy lane.
#
# The fast public checks (fmt / check / clippy, dev-mode, no native lib) run on
# GitHub Actions (.github/workflows/ci.yml) so external contributors get them on
# every PR. This pipeline owns the jobs that need Reactor's self-hosted agents:
# building our own libwebrtc per target (a ~30GB+ checkout + multi-hour compile
# that hosted runners can't fit) and the lib-linked FFI/integration tests.
#
# Mirrors cpp_sdk / py-sdk: heavy work on self-hosted queues, with steps that
# need not-yet-provisioned hardware marked `skip:` so the shape stays visible.
#
# Per-target prebuilts (lib + headers + .sha256 + manifest + CycloneDX SBOM) are
# uploaded as Buildkite artifacts; the publish-to-CDN step runs on `main`.

agents:
  queue: default

steps:
  # ── Linux x64 (native: build + package + lib-linked tests) ─────────────────
  - key: webrtc-linux-x64
    label: ":webrtc: libwebrtc linux/x64 + tests"
    commands:
      - ./webrtc-build/build.sh linux x64 release
      - ./webrtc-build/package.sh linux x64 release
      - REACTOR_WEBRTC_LIB_DIR="$PWD/webrtc-build/out/linux-x64-release/dist" cargo test --workspace
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: heavy
    timeout_in_minutes: 360

  # ── Linux arm64 (native on an arm64 agent) ─────────────────────────────────
  - key: webrtc-linux-arm64
    label: ":webrtc: libwebrtc linux/arm64 + tests"
    commands:
      - ./webrtc-build/build.sh linux arm64 release
      - ./webrtc-build/package.sh linux arm64 release
      - REACTOR_WEBRTC_LIB_DIR="$PWD/webrtc-build/out/linux-arm64-release/dist" cargo test --workspace
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: arm64
    timeout_in_minutes: 360

  # ── Android arm64 (cross-compiled on a Linux agent; no on-host test run) ───
  - key: webrtc-android-arm64
    label: ":android: libwebrtc android/arm64"
    commands:
      - ./webrtc-build/build.sh android arm64 release
      - ./webrtc-build/package.sh android arm64 release
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: heavy
    timeout_in_minutes: 360

  # ── macOS arm64 (native: build + package + lib-linked tests) ───────────────
  - key: webrtc-macos-arm64
    label: ":apple: libwebrtc macos/arm64 + tests"
    commands:
      - ./webrtc-build/build.sh mac arm64 release
      - ./webrtc-build/package.sh mac arm64 release
      - REACTOR_WEBRTC_LIB_DIR="$PWD/webrtc-build/out/mac-arm64-release/dist" MACOSX_DEPLOYMENT_TARGET=13.0 cargo test --workspace
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: macos
    timeout_in_minutes: 360
    skip: "Enable once a macOS arm64 build agent (Xcode + large disk) is provisioned."

  # ── iOS arm64 (device) ─────────────────────────────────────────────────────
  - key: webrtc-ios-arm64
    label: ":apple: libwebrtc ios/arm64"
    commands:
      - IOS_ENV=device ./webrtc-build/build.sh ios arm64 release
      - ./webrtc-build/package.sh ios arm64 release
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: macos
    timeout_in_minutes: 360
    skip: "Enable once a macOS build agent is provisioned (shares the macOS queue)."

  # ── Windows x64 ────────────────────────────────────────────────────────────
  - key: webrtc-windows-x64
    label: ":windows: libwebrtc win/x64"
    commands:
      - ./webrtc-build/build.sh win x64 release
      - ./webrtc-build/package.sh win x64 release
    artifact_paths:
      - "webrtc-build/dist/*.tar.zst"
      - "webrtc-build/dist/*.sha256"
      - "webrtc-build/dist/*.manifest.json"
      - "webrtc-build/dist/*.sbom.json"
    agents:
      queue: windows
    timeout_in_minutes: 360
    skip: "Enable once a Windows build agent (VS toolchain + large disk) is provisioned."

  # ── Publish prebuilts to the CDN (main only) ───────────────────────────────
  # Downloads the per-target artifacts and pushes them to the host that
  # REACTOR_WEBRTC_PREBUILT_URL points at, merging the per-target manifests into
  # the prebuilt index. AWS access via Buildkite OIDC (no static keys).
  - key: webrtc-publish
    label: ":package: Publish prebuilts + index"
    if: 'build.branch == "main"'
    depends_on:
      - webrtc-linux-x64
      - webrtc-linux-arm64
      - webrtc-android-arm64
    commands:
      - buildkite-agent artifact download "webrtc-build/dist/*" .
      - ./webrtc-build/publish.sh
    agents:
      queue: default
    skip: "Enable once the prebuilt CDN/S3 host + webrtc-build/publish.sh land (M1)."
