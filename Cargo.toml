[workspace]
resolver = "2"
members = [
    "crates/reactor-webrtc-sys",
    "crates/reactor-webrtc",
    "crates/reactor-webrtc-py",
]
# reactor-webrtc-py is a cdylib (Maturin wheel) — excluded from the default
# workspace build so `cargo check/test` targets the library crates only.
default-members = [
    "crates/reactor-webrtc-sys",
    "crates/reactor-webrtc",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/reactor-team/reactor-webrtc"

# The pinned upstream WebRTC milestone is tracked in ./WEBRTC_VERSION and baked
# into the prebuilt artifacts produced by ./webrtc-build.
