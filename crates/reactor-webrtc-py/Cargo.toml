[package]
name = "reactor-webrtc-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # distributed as a Python wheel (PyPI), not a crate

[lib]
name = "reactor_webrtc"
crate-type = ["cdylib"]

[dependencies]
reactor-webrtc = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# Bridges PeerConnection's blocking signaling ops into native Python awaitables
# (see the "Async signaling" section of README.md). No I/O/timer drivers are
# needed — rt-multi-thread is enough for spawn_blocking + polling join handles.
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
