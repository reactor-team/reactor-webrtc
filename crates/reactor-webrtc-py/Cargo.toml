[package]
name = "reactor-webrtc-py"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish = false  # distributed as a Python wheel (PyPI), not a crate

[lib]
name = "reactor_webrtc"
crate-type = ["cdylib"]

[dependencies]
reactor-webrtc = { path = "../reactor-webrtc", version = "0.3.0" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[features]
default = []
