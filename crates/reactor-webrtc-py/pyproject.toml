[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "reactor-webrtc"
dynamic = ["version"]
description = "Python bindings for reactor-webrtc — WebRTC peer connections, tracks, data channels, and stats via PyO3"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/reactor-team/reactor-webrtc"
Repository = "https://github.com/reactor-team/reactor-webrtc"
"Bug Tracker" = "https://github.com/reactor-team/reactor-webrtc/issues"

[tool.maturin]
# The cdylib is named reactor_webrtc, imported as `import reactor_webrtc`.
module-name = "reactor_webrtc"
# Embed libwebrtc statically — the prebuilt archive linked at build time.
# maturin build --release produces a self-contained .so / .dylib wheel.
features = []
