[package]
name = "reactor-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Safe, idiomatic Rust API over an owned libwebrtc build — peer connections, tracks, data channels, and stats."
keywords = ["webrtc", "peer-connection", "real-time", "audio", "video"]
categories = ["multimedia", "network-programming", "api-bindings"]
build = "build.rs"

[lib]
doctest = false

[features]
# Real H.264 via a dynamically loaded OpenH264 (Cisco's prebuilt binary,
# downloaded at runtime — see the `openh264` module and PeerConnectionFactory
# ::with_openh264). See reactor-webrtc-sys's Cargo.toml for why this is opt-in.
openh264 = ["reactor-webrtc-sys/openh264"]

[dependencies]
reactor-webrtc-sys = { workspace = true }
reactor-webrtc-dc-chunking = { workspace = true }
prost = "0.13"
# TURN over TLS: verify the server chain against the Mozilla roots, because
# libwebrtc's built-in roots have no ISRG root (see src/tls.rs).
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"

[dev-dependencies]
# tests/turn_tls.rs: a local TLS server with a certificate from a test CA.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
