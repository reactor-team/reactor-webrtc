# Build our libwebrtc and publish the prebuilt archives consumed via
# REACTOR_WEBRTC_PREBUILT_URL.
#
# A full WebRTC build is large + slow (fetch is tens of GB; compile is hours).
# Hosted runners are tight on disk/time — treat this as a smoke build for
# macOS arm64 and move the full matrix to dedicated/self-hosted runners
# (sccache/RBE) for production.
#
#   • push to WEBRTC_VERSION / webrtc-build/** / this workflow → build macOS arm64.
#   • workflow_dispatch (run_all=true)                         → build the full matrix.
name: webrtc-build

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Build the full target matrix (otherwise macOS arm64 only)"
        type: boolean
        default: false
      profile:
        description: "Build profile"
        type: choice
        default: release
        options: [release, debug]
  push:
    paths:
      - "WEBRTC_VERSION"
      - "webrtc-build/**"
      - ".github/workflows/webrtc-build.yml"

concurrency:
  group: webrtc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute the target matrix here (instead of a job-level `if` over `matrix`,
  # which can't gate matrix combinations): macOS arm64 by default, full set on
  # workflow_dispatch with run_all=true.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      profile: ${{ steps.gen.outputs.profile }}
    steps:
      - id: gen
        run: |
          mac='{"include":[{"os":"mac","arch":"arm64","runner":"macos-14"}]}'
          full='{"include":[{"os":"mac","arch":"arm64","runner":"macos-14"},{"os":"mac","arch":"x64","runner":"macos-13"},{"os":"ios","arch":"arm64","runner":"macos-14"},{"os":"linux","arch":"x64","runner":"ubuntu-latest"},{"os":"linux","arch":"arm64","runner":"ubuntu-latest"},{"os":"android","arch":"arm64","runner":"ubuntu-latest"},{"os":"win","arch":"x64","runner":"windows-latest"}]}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run_all }}" = "true" ]; then
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$mac" >> "$GITHUB_OUTPUT"
          fi
          prof="${{ github.event.inputs.profile }}"
          echo "profile=${prof:-release}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.setup.outputs.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Disk before
        run: df -h || true

      - name: Build libwebrtc
        run: ./webrtc-build/build.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      - name: Package + checksum
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd) || brew install zstd || true
          ./webrtc-build/package.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      - name: Disk after
        if: always()
        run: df -h || true

      - name: Upload prebuilt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-webrtc-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            webrtc-build/dist/*.tar.zst
            webrtc-build/dist/*.sha256
            webrtc-build/dist/*.manifest.json
            webrtc-build/dist/*.sbom.json
          if-no-files-found: error
          retention-days: 7
      # TODO(M1): publish to the CDN/S3 host that REACTOR_WEBRTC_PREBUILT_URL
      # points at, merge the per-target manifests into the prebuilt index, and
      # generate an SBOM — instead of upload-artifact.
