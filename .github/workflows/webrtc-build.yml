# Build our libwebrtc and publish the prebuilt archives consumed via
# REACTOR_WEBRTC_PREBUILT_URL.
#
# A full WebRTC build is large + slow (fetch is tens of GB; compile is hours).
# Hosted runners are tight on disk/time — treat this as a smoke build for
# macOS arm64 and move the full matrix to dedicated/self-hosted runners
# (sccache/RBE) for production.
#
#   • push to WEBRTC_VERSION / webrtc-build/** / this workflow → build macOS arm64.
#   • workflow_dispatch (run_all=true)                         → build the full matrix.
name: webrtc-build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build"
        type: choice
        default: mac
        options: [mac, linux, android, linux+android, full]
      profile:
        description: "Build profile"
        type: choice
        default: release
        options: [release, debug]
  push:
    paths:
      - "WEBRTC_VERSION"
      - "webrtc-build/**"
      - ".github/workflows/webrtc-build.yml"

concurrency:
  group: webrtc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute the target matrix here (a job-level `if` can't gate matrix
  # combinations). Pushes build macOS arm64; workflow_dispatch picks via the
  # `targets` input (mac / linux / android / linux+android / full).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      profile: ${{ steps.gen.outputs.profile }}
    steps:
      - id: gen
        run: |
          mac='{"os":"mac","arch":"arm64","runner":"macos-14"}'
          macx64='{"os":"mac","arch":"x64","runner":"macos-13"}'
          ios='{"os":"ios","arch":"arm64","runner":"macos-14"}'
          linux_x64='{"os":"linux","arch":"x64","runner":"ubuntu-latest"}'
          linux_arm='{"os":"linux","arch":"arm64","runner":"ubuntu-latest"}'
          android='{"os":"android","arch":"arm64","runner":"ubuntu-latest"}'
          win='{"os":"win","arch":"x64","runner":"windows-latest"}'
          t="${{ github.event.inputs.targets }}"
          [ "${{ github.event_name }}" = "push" ] && t=mac
          t="${t:-mac}"
          case "$t" in
            mac)            inc="$mac" ;;
            linux)          inc="$linux_x64,$linux_arm" ;;
            android)        inc="$android" ;;
            linux+android)  inc="$linux_x64,$linux_arm,$android" ;;
            full)           inc="$mac,$macx64,$ios,$linux_x64,$linux_arm,$android,$win" ;;
            *)              inc="$mac" ;;
          esac
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          prof="${{ github.event.inputs.profile }}"
          echo "profile=${prof:-release}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROFILE: ${{ needs.setup.outputs.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # A WebRTC checkout + build is ~30GB+ (Android adds the NDK/SDK on
          # top). Hosted runners start with ~14GB free; reclaim aggressively.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true && sudo rm -f /mnt/swapfile || true
          df -h

      - name: Disk before
        run: df -h || true

      - name: Build libwebrtc
        run: ./webrtc-build/build.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      - name: Package + checksum
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd) || brew install zstd || true
          ./webrtc-build/package.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      - name: Disk after
        if: always()
        run: df -h || true

      - name: Upload prebuilt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-webrtc-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            webrtc-build/dist/*.tar.zst
            webrtc-build/dist/*.sha256
            webrtc-build/dist/*.manifest.json
            webrtc-build/dist/*.sbom.json
          if-no-files-found: error
          retention-days: 7
      # TODO(M1): publish to the CDN/S3 host that REACTOR_WEBRTC_PREBUILT_URL
      # points at, merge the per-target manifests into the prebuilt index, and
      # generate an SBOM — instead of upload-artifact.
