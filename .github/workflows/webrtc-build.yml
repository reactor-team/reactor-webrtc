# Build our owned libwebrtc per target and (optionally) publish the prebuilts
# as a GitHub Release.
#
# A WebRTC checkout + build is large + slow (fetch is tens of GB; compile is
# minutes-to-hours on a cold runner). Triggers:
#   • push / pull_request touching WEBRTC_VERSION, webrtc-build/** (non-markdown),
#     or this workflow file → full target matrix, debug profile.
#   • workflow_dispatch → pick `targets` and `profile`; set `publish=true` to
#     cut a GitHub Release (release prebuilts are always manual).
#
# Host coverage (cross-compile aware):
#   • macos-15 (Apple Silicon + Xcode 16) → mac arm64, mac x64, iOS device + sim.
#       macos-15 ships MacOSX15.sdk; protobuf's `constinit fixed_address_empty_string`
#       needs libc++'s constexpr allocator, absent from the MacOSX14.5.sdk on macos-14.
#   • ubuntu-latest / ubuntu-24.04     → linux x64, android (NDK via gclient).
#   • ubuntu-24.04 (explicit x86_64)   → linux arm64 cross-compile.
#   • windows-latest                   → win x64.
name: webrtc-build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build"
        type: choice
        default: full
        options: [full, mac, apple, linux, android, win]
      profile:
        description: "Build profile"
        type: choice
        default: release
        options: [release, debug]
      publish:
        description: "Publish the built prebuilts as a GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "WEBRTC_VERSION"
      - "webrtc-build/**"
      - "!webrtc-build/**.md"
      - ".github/workflows/webrtc-build.yml"
  pull_request:
    paths:
      - "WEBRTC_VERSION"
      - "webrtc-build/**"
      - "!webrtc-build/**.md"
      - ".github/workflows/webrtc-build.yml"

concurrency:
  # Key on the event too: a push (mac smoke) and a workflow_dispatch (chosen
  # targets) on the same ref must not cancel each other.
  group: webrtc-build-${{ github.ref }}-${{ github.event_name }}
  # PRs: halt the in-flight matrix and run only the newest push. Main merges
  # and manual release dispatches must never be cancelled mid-build - they
  # block instead, queueing behind the running build until it completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compute the build matrix (a job-level `if` can't gate matrix combinations).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      profile: ${{ steps.gen.outputs.profile }}
    steps:
      - id: gen
        run: |
          mac_arm='{"os":"mac","arch":"arm64","runner":"macos-15"}'
          mac_x64='{"os":"mac","arch":"x64","runner":"macos-15"}'
          ios_dev='{"os":"ios","arch":"arm64","runner":"macos-15","ios_env":"device"}'
          ios_sim='{"os":"ios","arch":"arm64","runner":"macos-15","ios_env":"simulator"}'
          linux_x64='{"os":"linux","arch":"x64","runner":"ubuntu-latest"}'
          # linux/arm64 is cross-compiled from x86_64 (no linux-arm64 bundled clang).
          # ubuntu-24.04 is explicit x86_64; ubuntu-latest maps to arm64 in this org.
          linux_arm='{"os":"linux","arch":"arm64","runner":"ubuntu-24.04"}'
          android='{"os":"android","arch":"arm64","runner":"ubuntu-latest"}'
          win='{"os":"win","arch":"x64","runner":"windows-latest"}'
          # CI (push / pull_request) → full target matrix, debug profile.
          # workflow_dispatch → use the selected inputs.
          t="${{ github.event.inputs.targets }}"
          prof="${{ github.event.inputs.profile }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            t=full
            prof=debug
          fi
          t="${t:-mac}"
          case "$t" in
            mac)      inc="$mac_arm" ;;
            apple)    inc="$mac_arm,$mac_x64,$ios_dev,$ios_sim" ;;
            linux)    inc="$linux_x64,$linux_arm" ;;
            android)  inc="$android" ;;
            win)      inc="$win" ;;
            full)     inc="$mac_arm,$mac_x64,$ios_dev,$ios_sim,$linux_x64,$linux_arm,$android,$win" ;;
            linux-x64) inc="$linux_x64" ;;
            *)        inc="$mac_arm" ;;
          esac
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          echo "profile=${prof:-release}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ios_env && format('-{0}', matrix.ios_env) || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash   # the webrtc-build/*.sh scripts are bash; windows-latest needs Git Bash
    env:
      PROFILE: ${{ needs.setup.outputs.profile }}
      IOS_ENV: ${{ matrix.ios_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # ~30GB+ checkout + Android NDK/SDK vs ~14GB free on hosted runners.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true && sudo rm -f /mnt/swapfile || true
          df -h

      - name: Select newest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          # protobuf's `constinit fixed_address_empty_string` needs libc++'s
          # constexpr std::allocator::allocate (Xcode 16 / MacOSX15.sdk+). Pin the
          # newest installed Xcode so the SDK matches what builds locally.
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --show-sdk-path)"

      # POSIX targets: bash build.sh + package.sh.
      - name: Build libwebrtc
        if: matrix.os != 'win'
        run: ./webrtc-build/build.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      - name: Package + SBOM
        if: matrix.os != 'win'
        run: |
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd) || brew install zstd || true
          ./webrtc-build/package.sh ${{ matrix.os }} ${{ matrix.arch }} "$PROFILE"

      # Windows: depot_tools is a native toolchain (Git Bash breaks its CIPD
      # bootstrap), so build + package run in PowerShell via build.ps1.
      - name: Build + package libwebrtc (Windows)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          choco install zstd -y --no-progress | Out-Null
          git config --global user.email "ci@reactor.inc"
          git config --global user.name  "reactor ci"
          # Git for Windows defaults to autocrlf=true → the checkout gets CRLF and
          # our LF patch series won't apply. Force LF for the webrtc checkout.
          git config --global core.autocrlf false
          ./webrtc-build/build.ps1 -Arch ${{ matrix.arch }} -Profile $env:PROFILE

      # linux glue compiles against the bundled libc++ (ABI namespace __Cr) whose
      # headers need a recent clang (stock clang-18 is too old); install it.
      - name: Test deps (linux)
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wget lsb-release software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 || sudo /tmp/llvm.sh 20 || sudo /tmp/llvm.sh
          ver=21; command -v clang++-21 >/dev/null || ver=20; command -v clang++-$ver >/dev/null || ver=$(ls /usr/bin/clang++-* | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "CXX=clang++-$ver" >> "$GITHUB_ENV"; echo "CC=clang-$ver" >> "$GITHUB_ENV"

      # Run the lib-linked FFI/integration tests where the target runs natively:
      # macOS arm64 and linux x64. (iOS/android/windows are cross or non-native;
      # linux/arm64 is cross-built on x86_64.)
      - name: Test (native targets)
        if: (matrix.os == 'mac' && matrix.arch == 'arm64') || (matrix.os == 'linux' && matrix.arch == 'x64')
        run: |
          SLUG="${{ matrix.os }}-${{ matrix.arch }}-${PROFILE}"
          export REACTOR_WEBRTC_LIB_DIR="$PWD/webrtc-build/out/$SLUG/dist"
          [ "${{ runner.os }}" = "macOS" ] && export MACOSX_DEPLOYMENT_TARGET=13.0
          cargo test --workspace

      - name: Upload prebuilt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ios_env && format('-{0}', matrix.ios_env) || '' }}
          path: |
            webrtc-build/dist/*.tar.zst
            webrtc-build/dist/*.sha256
            webrtc-build/dist/*.manifest.json
            webrtc-build/dist/*.sbom.json
          if-no-files-found: error
          retention-days: 14

  # Publish the per-target prebuilts as a GitHub Release (opt-in via dispatch).
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    # Cutting a release ships prebuilt native binaries that downstream packages
    # link against, so the publish is gated on the `release` environment: its
    # required reviewers put a human approval between a dispatch and a public
    # release, rather than letting anyone with write publish unilaterally.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all prebuilts
        uses: actions/download-artifact@v4
        with:
          path: webrtc-build/dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./webrtc-build/publish.sh
