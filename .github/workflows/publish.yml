name: Publish

# Triggered by a semver tag (v0.1.0, v1.2.3, …) or manually for a dry run.
# Each crate carries its own version in its Cargo.toml — bump only the crates
# that changed before tagging. The publish steps skip crates whose current
# version is already on crates.io, so unchanged crates are never re-published.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build everything but skip the actual publish steps"
        type: boolean
        default: true

# Prevent two publish runs from racing on the same tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Rust crates → crates.io ──────────────────────────────────────────
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read   # actions/checkout
      id-token: write  # OIDC trusted publishing — no API token required
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Bake the current libwebrtc release tag into build.rs so that the
      # published crate always downloads the right prebuilt without any
      # hardcoded fallback requiring a manual update.
      - name: Patch PREBUILT_TAG_FALLBACK from WEBRTC_VERSION
        run: |
          source WEBRTC_VERSION
          MILESTONE=${WEBRTC_BRANCH#branch-heads/}
          COMMIT_SHORT=${WEBRTC_COMMIT:0:8}
          TAG="webrtc-${MILESTONE}-${COMMIT_SHORT}-p${REACTOR_PATCH_LEVEL}"
          echo "Patching PREBUILT_TAG_FALLBACK → ${TAG}"
          sed -i "s/const PREBUILT_TAG_FALLBACK: &str = \"[^\"]*\"/const PREBUILT_TAG_FALLBACK: \&str = \"${TAG}\"/" \
            crates/reactor-webrtc-sys/build.rs
          grep PREBUILT_TAG_FALLBACK crates/reactor-webrtc-sys/build.rs

      # Exchange the GitHub OIDC JWT for a short-lived crates.io publish token.
      # Set up at: https://crates.io/crates/reactor-webrtc-sys/settings/trusted-publishing
      #            https://crates.io/crates/reactor-webrtc/settings/trusted-publishing
      # Publisher: reactor-team/reactor-webrtc, workflow: publish.yml, environment: crates-io
      - name: Authenticate to crates.io
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publish sys first (webrtc depends on it), then webrtc.
      # Each step queries crates.io first and skips if the version is already
      # published — safe to re-run and handles partial-release recovery.
      - name: Publish crates
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          already_published() {
            local crate="$1" version="$2"
            curl -sf "https://crates.io/api/v1/crates/${crate}/${version}" \
              -H "User-Agent: reactor-webrtc-ci" \
              | jq -e '.version.num' > /dev/null 2>&1
          }

          SYS_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="reactor-webrtc-sys") | .version')
          WRT_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="reactor-webrtc") | .version')

          if already_published reactor-webrtc-sys "$SYS_VER"; then
            echo "::notice::reactor-webrtc-sys@${SYS_VER} already on crates.io — skipping"
          else
            cargo publish -p reactor-webrtc-sys --no-verify --allow-dirty
            echo "Waiting 45 s for crates.io index…"
            sleep 45
          fi

          if already_published reactor-webrtc "$WRT_VER"; then
            echo "::notice::reactor-webrtc@${WRT_VER} already on crates.io — skipping"
          else
            cargo publish -p reactor-webrtc --no-verify --allow-dirty
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Dry-run summary (crates)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "DRY RUN — would publish:"
          cargo package -p reactor-webrtc-sys --no-verify --list
          cargo package -p reactor-webrtc      --no-verify --list

  # ── 2. Python wheels → PyPI ─────────────────────────────────────────────
  # Dependency chain for the wheel build: reactor-webrtc-py → reactor-webrtc
  # → reactor-webrtc-sys. Cargo resolves the local path deps automatically;
  # no manual ordering needed within the build step.
  build-wheels:
    name: Build wheel · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_34"  # AlmaLinux 9; clang-21 available in AppStream

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_34"

          - platform: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"

          - platform: mac-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"

          - platform: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            # libwebrtc.lib uses /MT (static CRT); Rust must match to avoid LNK2038.
            rustflags: "-C target-feature=+crt-static"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Derive the libwebrtc release tag from WEBRTC_VERSION and build the
      # matching prebuilt asset URL. The repo is public, so the release download
      # URLs are fetchable anonymously — no token anywhere in the build.
      # Fetching the .sha256 sidecar here doubles as an existence check: curl -f
      # fails the step if the release or the asset is missing.
      - name: Resolve libwebrtc prebuilt URL
        id: prebuilt
        shell: bash
        run: |
          source WEBRTC_VERSION
          MILESTONE=${WEBRTC_BRANCH#branch-heads/}
          COMMIT_SHORT=${WEBRTC_COMMIT:0:8}
          TAG="webrtc-${MILESTONE}-${COMMIT_SHORT}-p${REACTOR_PATCH_LEVEL}"
          ASSET="reactor-webrtc-${{ matrix.platform }}-release.tar.zst"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          echo "Resolving '${ASSET}' in release '${TAG}'..."
          SHA256=$(curl -fsSL --retry 3 "${BASE}/${ASSET}.sha256" | awk '{print $1}')
          if [ -z "$SHA256" ]; then
            echo "::error::Empty sha256 sidecar for '${ASSET}' in release '${TAG}'"
            exit 1
          fi
          echo "url=${BASE}/${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Set macOS deployment target (mac-x64)
        if: matrix.platform == 'mac-x64'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --manifest-path crates/reactor-webrtc-py/Cargo.toml
            --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # For Linux manylinux builds, maturin runs inside a Docker container
          # and step-level env vars are not forwarded. Set PREBUILT_URL/SHA256
          # via before-script-linux so build.rs downloads and extracts the
          # prebuilt directly inside the container (avoiding any host→container
          # path-mapping issues with the 697MB extracted tree).
          before-script-linux: |
            dnf install -y clang lld zstd
            export CXX=clang++
            # Use clang+lld as the Rust linker. GNU ld (from gcc-toolset) rejects
            # libwebrtc.a objects that may be LLVM ThinLTO bitcode; lld handles both
            # native ELF and LTO bitcode objects correctly.
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=clang
            else
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
            fi
            export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
            export REACTOR_WEBRTC_PREBUILT_URL="${{ steps.prebuilt.outputs.url }}"
            export REACTOR_WEBRTC_PREBUILT_SHA256="${{ steps.prebuilt.outputs.sha256 }}"
        env:
          # mac/windows: maturin runs natively and inherits step-level env vars.
          # linux: PREBUILT_URL/SHA256 are set in before-script-linux above instead.
          REACTOR_WEBRTC_PREBUILT_URL: ${{ steps.prebuilt.outputs.url }}
          REACTOR_WEBRTC_PREBUILT_SHA256: ${{ steps.prebuilt.outputs.sha256 }}
          # win-x64 only: libwebrtc.lib uses /MT; Rust must match (see matrix.rustflags).
          # Linux overrides RUSTFLAGS inside before-script-linux; mac has no RUSTFLAGS.
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Import the just-built wheel natively on the target runner.  Running this
      # before upload catches broken binaries (missing symbols, wrong libc++
      # linkage) before they reach PyPI — the exact failure mode of REA-4690,
      # where the linux-aarch64 wheel silently shipped with an unresolved __Cr
      # symbol that was never executed in CI.
      - name: Smoke-test wheel import
        shell: bash
        run: |
          pip install --no-index --find-links dist/ reactor_webrtc
          python -c "import reactor_webrtc; print('reactor_webrtc imported ok')"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  # publish-python runs only after BOTH build-wheels AND publish-crates succeed,
  # ensuring we never publish to PyPI if the crates release failed.
  publish-python:
    name: Publish Python package to PyPI
    needs: [build-wheels, publish-crates]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing — no API token required
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed — uses OIDC trusted publishing configured on PyPI.
        # Set up at: https://pypi.org/manage/project/reactor-webrtc/settings/publishing/
        # Publisher: reactor-team/reactor-webrtc, workflow: publish.yml, env: pypi

      - name: Dry-run summary (Python)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "DRY RUN — wheels that would be published:"
          ls -1 dist/
