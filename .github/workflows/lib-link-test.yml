# Fast lib-link test: download a prebuilt libwebrtc artifact from a webrtc-build
# run and compile + link + run the reactor-webrtc lib-link test against it —
# WITHOUT rebuilding libwebrtc (~minutes, vs ~1h for a full build). Used to
# iterate the sys crate's glue/link config (esp. the linux bundled-libc++ path).
name: lib-link-test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "webrtc-build run id that produced the prebuilt artifact"
        required: true
      artifact:
        description: "artifact name to test"
        type: choice
        default: prebuilt-linux-x64
        options: [prebuilt-linux-x64, prebuilt-linux-arm64]

permissions:
  contents: read
  actions: read   # gh run download from another run's artifacts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps (recent clang for the bundled libc++ glue)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd wget lsb-release software-properties-common gnupg
          # The bundled libc++ headers (Chromium's llvm-23 clang) use builtins
          # (__builtin_popcountg, __is_convertible, …) absent from stock clang-18,
          # so install the newest clang from apt.llvm.org and use it for the glue.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 || sudo /tmp/llvm.sh 20 || sudo /tmp/llvm.sh
          ver=21; command -v clang++-21 >/dev/null || ver=20; command -v clang++-$ver >/dev/null || ver=$(ls /usr/bin/clang++-* | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "CXX=clang++-$ver" >> "$GITHUB_ENV"
          echo "CC=clang-$ver" >> "$GITHUB_ENV"
          clang++-$ver --version | head -1
      - name: Fetch + extract prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n "${{ inputs.artifact }}" -D dl
          mkdir -p prebuilt
          zstd -dc dl/*.tar.zst | tar -x -C prebuilt
          echo "extracted: $(ls prebuilt) ; lib: $(ls prebuilt/lib)"
          test -d prebuilt/include/third_party/libc++/src/include \
            && echo "bundled libc++ headers: present" \
            || echo "bundled libc++ headers: MISSING (rebuild prebuilt with updated package.sh)"
      - name: cargo test (lib-linked)
        run: |
          export REACTOR_WEBRTC_LIB_DIR="$PWD/prebuilt"
          cargo test -p reactor-webrtc --verbose
