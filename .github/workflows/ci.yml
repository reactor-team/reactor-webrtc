name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.6.14"   # pinned; must be >= mise.toml min_version
  # Workflow-level so every step (mise-action AND the `mise run` steps) sees it.
  MISE_LOCKED: "1"            # install/run only mise.lock versions; never float
  # CI installs the Rust toolchain via actions-rust-lang/setup-rust-toolchain
  # (reads rust-toolchain.toml). Disable mise's rust/rustup so the action owns it.
  # That action also exports RUSTFLAGS="-D warnings" - kept on purpose: warnings
  # are errors in CI.
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

jobs:
  lint:
    name: fmt + clippy + repo lints
    runs-on: ubuntu-latest
    env:
      # check/clippy compile the sys crate's C++ glue, which build.rs auto-detects
      # + downloads the prebuilt headers for (public release assets, no auth);
      # needs a recent clang.
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # mise.lock drift check diffs against the merge-base
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true   # keep the dep cache from red runs; PR iteration is the hot path
      # The bundled libc++ headers in the prebuilt (Chromium llvm-23) require
      # clang >= 20 (builtins like __builtin_clzg added in that toolchain era).
      - name: Install clang-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-21
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
      - run: hk validate   # the hk.pkl that drives local git hooks parses
      - run: mise run fmt:check
      - run: mise run clippy
      - run: mise run lint:shell
      - run: mise run lint:mise-tools-root
      - name: mise.lock drift (vs merge-base)
        run: mise run lint:mise-lock

  # Check whether the prebuilt for the current WEBRTC_VERSION has already been
  # published to GitHub Releases.  When REACTOR_PATCH_LEVEL is bumped on a
  # webrtc-build PR the new prebuilt doesn't exist yet — platform-pipeline
  # skips here (webrtc-build.yml covers this PR using the CI-built artifact
  # instead). Once the patch is published, platform-pipeline runs normally.
  prebuilt-check:
    name: Check prebuilt availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          source WEBRTC_VERSION
          MILESTONE=${WEBRTC_BRANCH#branch-heads/}
          TAG="webrtc-${MILESTONE}-${WEBRTC_COMMIT:0:8}-p${REACTOR_PATCH_LEVEL}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/reactor-webrtc-linux-x64-release.tar.zst.sha256"
          echo "Probing release '${TAG}'..."
          if curl -fsSL --retry 3 --max-time 20 "$URL" > /dev/null 2>&1; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
            echo "Release '${TAG}' is published — platform-pipeline will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release '${TAG}' not yet published — platform-pipeline skips here; webrtc-build.yml covers this PR."
          fi

  # Each matrix entry calls platform-pipeline.yml once, which runs the full
  # per-platform chain: reactor-webrtc-sys build+check -> reactor-webrtc
  # build+check -> wheel build -> pytest, each stage gating the next. Platforms
  # run fully in parallel with each other (no shared "wait for the whole
  # matrix" barrier), and any stage can be re-run on its own without
  # re-running the stages before it.
  platform-pipeline:
    name: ${{ matrix.platform }}
    needs: [prebuilt-check]
    if: needs.prebuilt-check.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest

          - platform: linux-arm64
            os: ubuntu-24.04-arm

          - platform: mac-arm64
            os: macos-latest

          - platform: mac-x64
            os: macos-15-intel

          - platform: win-x64
            os: windows-latest
            rustflags: "-C target-feature=+crt-static"

    uses: ./.github/workflows/platform-pipeline.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      rustflags: ${{ matrix.rustflags }}

  # Advisory only: never referenced by ci-complete's `needs`, so it can never
  # block a merge. Flags — via a ::warning:: annotation, not a failing step —
  # a PR that touches public config/API surface without touching any
  # documentation, per CONTRIBUTING.md's "keep docs in sync" step. A path-based
  # heuristic can't know whether docs actually needed updating, so it only
  # warns; treat a warning here as a prompt to double-check, not a verdict.
  docs-check:
    name: Docs freshness (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether public-surface changes came with a docs update
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          SURFACE_HIT=$(echo "$CHANGED" | grep -E '^(crates/reactor-webrtc-py/reactor_webrtc\.pyi|crates/reactor-webrtc/src/config\.rs)$' || true)
          DOCS_HIT=$(echo "$CHANGED" | grep -E '^(docs/.*\.md|README\.md|crates/[^/]+/README\.md)$' || true)

          if [ -n "$SURFACE_HIT" ] && [ -z "$DOCS_HIT" ]; then
            echo "::warning::This PR changes public config/API surface but no docs/README file. Changed surface files:"
            echo "$SURFACE_HIT" | sed 's/^/::warning::  - /'
            echo "::warning::If this doesn't need a docs update, ignore this — it's advisory only and does not block merging (see CONTRIBUTING.md)."
          else
            echo "No advisory needed."
          fi

  ci-complete:
    name: CI Complete
    needs: [lint, prebuilt-check, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.prebuilt-check.result }}" \
            "${{ needs.platform-pipeline.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job failed ($r)"; exit 1
            fi
          done
          echo "All CI checks passed."
