name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: check + fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Without REACTOR_WEBRTC_LIB_DIR the build script skips native linking and
      # does not emit cfg(have_libwebrtc), so check/clippy/test all build the Rust
      # API surface only. Tests gated on have_libwebrtc compile to empty modules
      # and pass with 0 tests. A full linked test run requires a prebuilt artifact
      # (set REACTOR_WEBRTC_PREBUILT_URL/_SHA256 or REACTOR_WEBRTC_LIB_DIR).
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
