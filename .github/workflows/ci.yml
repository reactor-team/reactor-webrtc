name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_VERSION: "2026.6.14"   # pinned; must be >= mise.toml min_version
  # Workflow-level so every step (mise-action AND the `mise run` steps) sees it.
  MISE_LOCKED: "1"            # install/run only mise.lock versions; never float
  # CI installs the Rust toolchain via actions-rust-lang/setup-rust-toolchain
  # (reads rust-toolchain.toml). Disable mise's rust/rustup so the action owns it.
  # That action also exports RUSTFLAGS="-D warnings" - kept on purpose: warnings
  # are errors in CI.
  MISE_DISABLE_TOOLS: "rust,rustup,aqua:rust-lang/rustup"

jobs:
  lint:
    name: fmt + clippy + repo lints
    runs-on: ubuntu-latest
    env:
      # check/clippy compile the sys crate's C++ glue, which build.rs auto-detects
      # + downloads the prebuilt headers for (public release assets, no auth);
      # needs a recent clang.
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mise.lock drift check diffs against the merge-base
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache-on-failure: true   # keep the dep cache from red runs; PR iteration is the hot path
      # The bundled libc++ headers in the prebuilt (Chromium llvm-23) require
      # clang >= 20 (builtins like __builtin_clzg added in that toolchain era).
      - name: Install clang-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-21
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      - run: hk validate   # the hk.pkl that drives local git hooks parses
      - run: mise run fmt:check
      - run: mise run clippy
      - run: mise run lint:shell
      - run: mise run lint:mise-tools-root
      - name: mise.lock drift (vs merge-base)
        run: mise run lint:mise-lock

  test:
    name: cargo test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest

          - platform: linux-arm64
            os: ubuntu-24.04-arm

          - platform: mac-arm64
            os: macos-latest

          - platform: win-x64
            os: windows-latest
            # libwebrtc.lib uses /MT (static CRT); Rust must match to avoid LNK2038.
            rustflags: "-C target-feature=+crt-static"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Derive the prebuilt URL+SHA256 from WEBRTC_VERSION so this job always
      # tests the prebuilt that matches the current source tree, and stays in
      # sync automatically when REACTOR_PATCH_LEVEL is bumped.
      - name: Resolve libwebrtc prebuilt
        id: prebuilt
        shell: bash
        run: |
          source WEBRTC_VERSION
          MILESTONE=${WEBRTC_BRANCH#branch-heads/}
          COMMIT_SHORT=${WEBRTC_COMMIT:0:8}
          TAG="webrtc-${MILESTONE}-${COMMIT_SHORT}-p${REACTOR_PATCH_LEVEL}"
          ASSET="reactor-webrtc-${{ matrix.platform }}-release.tar.zst"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          echo "Resolving '${ASSET}' in release '${TAG}'..."
          SHA256=$(curl -fsSL --retry 3 "${BASE}/${ASSET}.sha256" | awk '{print $1}')
          if [ -z "$SHA256" ]; then
            echo "::error::Empty sha256 sidecar for '${ASSET}' in release '${TAG}'"
            exit 1
          fi
          echo "url=${BASE}/${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true

      # The bundled libc++ headers require clang >= 20. apt.llvm.org provides
      # aarch64 packages for Noble — same install procedure as x64.
      - name: Install clang-21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-21
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      # mise has lockfile entries for linux-x64, linux-arm64, and macos-arm64.
      # Windows is excluded from the lockfile (its builds use maturin-action);
      # run cargo test directly there instead.
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: mise run test
        env:
          REACTOR_WEBRTC_PREBUILT_URL: ${{ steps.prebuilt.outputs.url }}
          REACTOR_WEBRTC_PREBUILT_SHA256: ${{ steps.prebuilt.outputs.sha256 }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude reactor-webrtc-py
        env:
          REACTOR_WEBRTC_PREBUILT_URL: ${{ steps.prebuilt.outputs.url }}
          REACTOR_WEBRTC_PREBUILT_SHA256: ${{ steps.prebuilt.outputs.sha256 }}
          RUSTFLAGS: ${{ matrix.rustflags }}

  build-wheel:
    name: build reactor-webrtc wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest

          - platform: linux-arm64
            os: ubuntu-24.04-arm

          - platform: mac-arm64
            os: macos-latest

          - platform: win-x64
            os: windows-latest
            # libwebrtc.lib uses /MT (static CRT); Rust must match to avoid LNK2038.
            rustflags: "-C target-feature=+crt-static"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve libwebrtc prebuilt
        id: prebuilt
        shell: bash
        run: |
          source WEBRTC_VERSION
          MILESTONE=${WEBRTC_BRANCH#branch-heads/}
          COMMIT_SHORT=${WEBRTC_COMMIT:0:8}
          TAG="webrtc-${MILESTONE}-${COMMIT_SHORT}-p${REACTOR_PATCH_LEVEL}"
          ASSET="reactor-webrtc-${{ matrix.platform }}-release.tar.zst"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          echo "Resolving '${ASSET}' in release '${TAG}'..."
          SHA256=$(curl -fsSL --retry 3 "${BASE}/${ASSET}.sha256" | awk '{print $1}')
          if [ -z "$SHA256" ]; then
            echo "::error::Empty sha256 sidecar for '${ASSET}' in release '${TAG}'"
            exit 1
          fi
          echo "url=${BASE}/${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: true

      - name: Install clang-21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-21
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      # Linux and macOS: mise has lockfile entries for these platforms.
      # Windows is excluded from mise's lockfile_platforms (its builds use
      # maturin-action directly, like publish.yml does).
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Build wheel (Linux / macOS)
        if: runner.os != 'Windows'
        run: mise run //crates/reactor-webrtc-py:build
        env:
          REACTOR_WEBRTC_PREBUILT_URL: ${{ steps.prebuilt.outputs.url }}
          REACTOR_WEBRTC_PREBUILT_SHA256: ${{ steps.prebuilt.outputs.sha256 }}

      # Windows: use maturin-action directly (same as publish.yml).
      # maturin-action handles installing maturin; output lands in dist/.
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --manifest-path crates/reactor-webrtc-py/Cargo.toml
            --out dist
          manylinux: "off"
        env:
          REACTOR_WEBRTC_PREBUILT_URL: ${{ steps.prebuilt.outputs.url }}
          REACTOR_WEBRTC_PREBUILT_SHA256: ${{ steps.prebuilt.outputs.sha256 }}
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Normalise artifact path: mise build lands in target/wheels/, maturin-action
      # in dist/. Copy dist/ → target/wheels/ on Windows so the upload and
      # test-py steps use the same path unconditionally.
      - name: Normalise wheel path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/wheels
          cp dist/*.whl target/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: target/wheels/reactor_webrtc-*.whl
          if-no-files-found: error

  test-py:
    name: pytest (${{ matrix.platform }}, built wheel)
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: mac-arm64
            os: macos-latest
          - platform: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: target/wheels
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Run Python tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: mise run //crates/reactor-webrtc-py:test
      # Windows: replicate the test task without mise/bash. uv is available on
      # GitHub Actions Windows runners via the pre-installed Python ecosystem.
      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          WHEEL=$(ls target/wheels/reactor_webrtc-*.whl | head -1)
          VENV="target/py-test-venv"
          python -m venv "$VENV"
          "$VENV/Scripts/pip" install pytest "$WHEEL"
          for f in crates/reactor-webrtc-py/tests/test_*.py; do
            "$VENV/Scripts/pytest" "$f" -v
          done

  ci-complete:
    name: CI Complete
    needs: [lint, test, build-wheel, test-py]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build-wheel.result }}" \
            "${{ needs.test-py.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job failed ($r)"; exit 1
            fi
          done
          echo "All CI checks passed."
