name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: fmt + check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: test (mac-arm64, libwebrtc prebuilt)
    # macOS: build.rs uses the system libc++ instead of the bundled one, so
    # there is no compiler-version requirement from the prebuilt's libc++ headers.
    # The linux prebuilt requires clang-20 (Chromium toolchain) which is not
    # easily available on ubuntu-22.04 runners.
    runs-on: macos-14
    env:
      # Release: webrtc-7907-a5ddff60-p1 — reactor-webrtc-mac-arm64-release.tar.zst
      REACTOR_WEBRTC_PREBUILT_URL: https://api.github.com/repos/reactor-team/reactor-webrtc/releases/assets/475845466
      REACTOR_WEBRTC_PREBUILT_SHA256: 20c2a158223a943a1cf6d939f67cb1abc7450bb2dc43bdb608544628892785e3
      REACTOR_WEBRTC_PREBUILT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo test --workspace
